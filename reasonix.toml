mpy as np\nx = np.load(\"moe_dump_xllm/step0/rank0_moe_input.npy\")\nv = np.load(\"moe_dump_vllm/step0/rank0_moe_input.npy\")\nprint(\"moe_input: xllm\", x.shape, \" vllm\", v.shape)\n\n# 对比前 9 token 的 moe_input\nprint(\"\\n=== moe_input 前 9 token 对比（xllm vs vllm）===\")\nfor i in range(min(9, len(x), len(v))):\n    d = np.max(np.abs(x[i].astype(np.float64) - v[i].astype(np.float64)))\n    same = np.allclose(x[i], v[i], atol=1e-3, rtol=1e-3)\n    print(f\"  row{i}: max_abs_diff={d:.4e}  allclose(1e-3)={same}\")\n\n# xllm 的第 9..134 token 是什么（vllm 没有的）\nprint(\"\\n=== xllm 第 9 行起的 moe_input（vllm 没有的部分）===\")\nprint(\"  xllm[9,:6] =\", np.round(x[9,:6],4).tolist())\nprint(\"  xllm 行范数：\", [round(float(np.linalg.norm(x[i])),1) for i in range(9,13)])\nPYEOF", "Bash=cd /export/home/wangxiaohan17/wangxiaohan/kimi-k3 && python3 - <<'PYEOF'\nimport numpy as np\nxr = np.load(\"moe_dump_xllm/step0/rank0_router_logits.npy\")   # (134, 896)\nvr = np.load(\"moe_dump_vllm/step0/rank0_router_logits.npy\")   # (9, 896)\nxt = np.load(\"moe_dump_xllm/step0/rank0_topk_ids.npy\")        # (144, 16) 对应 prepared\n\ndef native_topk(logits, k=16):\n    scores = 1.0/(1.0+np.exp(-logits.astype(np.float64)))  # sigmoid\n    ids = np.argsort(-scores, axis=-1)[:, :k]\n    w = np.take_along_axis(scores, ids, axis=-1)\n    w = w / w.sum(axis=-1, keepdims=True)\n    return ids, w\n\n# 注意 xllm 的 topk 是对 prepared(144) 做的；前 9 个 token 是否对应 router_logits 前 9？\n# 先对比 xllm router_logits 前 9 手动 topk vs xllm 的 topk_ids 前 9（验证对齐关系）\nx_ids, x_w = native_topk(xr[:9])\nprint(\"=== xllm: 手动 native topk(前9) vs 实际 fused topk_ids 前9 ===\")\nmatch = 0\nfor i in range(9):\n    fused = sorted(xt[i].tolist())\n    native = sorted(x_ids[i].tolist())\n    if fused == native:\n        match += 1\n    else:\n        print(f\"  row{i}: fused={fused}  native={native}\")\nprint(f\"  匹配行数: {match}/9\")\n\n# vllm 手动 topk\nv_ids, v_w = native_topk(vr[:9])\nprint(\"\\n=== xllm(native) vs vllm(native) topk 前9 token ===\")\nagree = 