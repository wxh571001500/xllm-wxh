_output.py)\necho \"$B64\" | sshpass -p 'USj5Qvl7zb29' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o PreferredAuthentications=password -o PubkeyAuthentication=no wangxiaohan17@11.87.191.104 \"docker exec -i vllm-k3-wxh bash -c 'base64 -d | python3'\" 2>&1 | tail -3", "Bash=cd /export/home/wangxiaohan17/wangxiaohan/kimi-k3 && python3 - <<'PYEOF'\nimport numpy as np\nx_out = np.load(\"moe_dump_xllm/step0/rank0_moe_output.npy\")      # (134, 7168)\nx_routed = np.load(\"moe_dump_xllm/step0/rank0_routed_output.npy\")\nv_out = np.load(\"moe_dump_vllm/step0/rank0_moe_output.npy\")      # (17, 7168)\nv_routed = np.load(\"moe_dump_vllm/step0/rank0_routed_output.npy\")\nprint(\"moe_output: xllm\", x_out.shape, \" vllm\", v_out.shape)\nprint(\"routed_output: xllm\", x_routed.shape, \" vllm\", v_routed.shape)\n\nn = min(len(x_out), len(v_out))\ndef cmp(name, a, b):\n    d = np.abs(a[:n].astype(np.float64) - b[:n].astype(np.float64))\n    rel = d / (np.abs(b[:n].astype(np.float64)) + 1e-3)\n    print(f\"{name}: max_abs={d.max():.3e}  mean_abs={d.mean():.3e}  max_rel={rel.max():.3f}\")\n\ncmp(\"moe_output\", x_out, v_out)\ncmp(\"routed_output\", x_routed, v_routed)\nprint(\"\\nmoe_output row0 前6: xllm\", np.round(x_out[0,:6],4).tolist(), \" vllm\", np.round(v_out[0,:6],4).tolist())\nprint(\"moe_output 行范数: xllm[0]\", round(float(np.linalg.norm(x_out[0])),1), \" vllm[0]\", round(float(np.linalg.norm(v_out[0])),1))\nPYEOF", "Bash=cd /export/home/wangxiaohan17/wangxiaohan/kimi-k3 && python3 - <<'PYEOF'\nimport pathlib\np = pathlib.Path(\"xllm_kimi_k3.sh\")\ns = p.read_text()\nold = 'export XLLM_ENABLE_FLASHCOMM1=\"${XLLM_ENABLE_FLASHCOMM1:-0}\"'\nnew = 'export XLLM_ENABLE_FLASHCOMM1=\"${XLLM_ENABLE_FLASHCOMM1:-1}\"'\nassert s.count(old) == 1, s.count(old)\ns = s.replace(old, new)\np.write_text(s)\nprint(\"xllm flashcomm1 已开启\")\nPYEOF\ngrep -n \"XLLM_ENABLE_FLASHCOMM1\" xllm_kimi_k3.sh", "Bash=cat > /export/home/ext.penghengduo1/CODE/KIMI-K3/xllm-wxh/xllm/python/layers/moe/dump_debug.py <<'PYEOF'\n# Copyright 2026 The xLLM Authors. All Rights Reserved.\n#\n# Licensed under the Apache License, Version 2.0 (the \"License\");\n# you may not use this file except in compliance with the License.\n# You may obtain a copy of the License at\n#\n#     https://github.com/jd-opensource/xllm/blob/main/LICENSE\n#\n# Unless required by applicable law or agreed to in writing, software\n# distributed under the License is distributed on an \"AS IS\" BASIS,\n# WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n# See the License for the specific language governing permissions and\n# limitations under the License.\n\n\"\"\"Debug dump helpers for MoE cross-framework alignment.\n\nDumps the first ``XLLM_MOE_DUMP_STEPS`` MoE forward steps (prefill + decode)\nof each rank into ``step0``, ``step1``, ... subdirectories. Delete the dump\ndirectory before sending the real request to restart numbering from step0\n(skipping warmup).\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\n\nimport numpy as np\nimport torch\nimport torch.distributed as dist\n\n_DUMP_DIR = os.environ.get(\"XLLM_MOE_DUMP_DIR\")\n_MAX_STEPS = int(os.environ.get(\"XLLM_MOE_DUMP_STEPS\", \"30\"))\n\n_step_counter = {\"n\": 0}\n_current_step = {\"v\": -1}\n\n\ndef _global_rank() -> int:\n    try:\n        if dist.is_available() and dist.is_initialized():\n            return dist.get_rank()\n    except Exception:\n        pass\n    return int(os.environ.get(\"RANK\", \"0\"))\n\n\ndef _alloc_step(rank: int) -> int:\n    marker = os.path.join(_DUMP_DIR, \"step0\", f\"rank{rank}_moe_input.npy\")\n    if not os.path.exists(marker):\n        _step_counter[\"n\"] = 0\n    step = _step_counter[\"n\"]\n    _step_counter[\"n\"] += 1\n    return step\n\n\ndef _save(step: int, rank: int, name: str, tensor: torch.Tensor) -> None:\n    if tensor is None:\n        return\n    out_dir = os.path.join(_DUMP_DIR, f\"step{step}\")\n    os.makedirs(out_dir, exist_ok=True)\n    arr = tensor.detach().cpu()\n    if name == \"topk_ids\":\n        arr = arr.to(torch.int64).numpy()\n    else:\n        arr = arr.to(torch.float32).numpy()\n    np.save(os.path.join(out_dir, f\"rank{rank}_{name}.npy\"), arr)\n\n\ndef dump_routing(\n    moe_input: torch.Tensor,\n    router_logits: torch.Tensor,\n    prepared_router_logits: torch.Tensor | None,\n    topk_ids: torch.Tensor,\n    topk_weights: torch.Tensor,\n) -> None:\n    \"\"\"Dump the routing-stage tensors of one MoE forward step.\"\"\"\n    if _DUMP_DIR is None:\n        return\n    rank = _global_rank()\n    step = _alloc_step(rank)\n    _current_step[\"v\"] = step\n    if step >= _MAX_STEPS:\n        return\n    _save(step, rank, \"moe_input\", moe_input)\n    _save(step, rank, \"router_logits\", router_logits)\n    _save(step, rank, \"prepared_router_logits\", prepared_router_logits)\n    _save(step, rank, \"topk_ids\", topk_ids)\n    _save(step, rank, \"topk_weights\", topk_weights)\n\n\ndef dump_moe_output(routed_output: torch.Tensor, output: torch.Tensor) -> None:\n    \"\"\"Dump the final MoE-layer output (routed + shared) of the current step.\"\"\"\n    if _DUMP_DIR is None:\n        return\n    step = _current_step[\"v\"]\n    if step < 0 or step >= _MAX_STEPS:\n        return\n    rank = _global_rank()\n    _save(step, rank, \"routed_output\", routed_output)\n    _save(step, rank, \"moe_output\", output)\n\n\n__all__ = [\"dump_routing\", \"dump_moe_output\"]\nPYEOF\npython3 -m py_compile /export/home/ext.penghengduo1/CODE/KIMI-K3/xllm-wxh/xllm/python/layers/moe/dump_debug.py && echo \"dump_debug.py 语法 OK\"", "Bash=cat > /tmp/patch_vllm_multi_step.py <<'PYEOF'\nimport pathlib\np = pathlib.Path(\"/vllm-workspace/vllm/vllm/model_executor/layers/fused_moe/runner/moe_runner.py\")\ns = p.read_text()\n\nold_dir = '_MOE_DUMP_DIR = os.environ.get(\"VLLM_MOE_DUMP_DIR\")'\nnew_dir = '_MOE_DUMP_DIR = os.environ.get(\"VLLM_MOE_DUMP_DIR\")\\n_MOE_DUMP_MAX = int(os.environ.get(\"VLLM_MOE_DUMP_STEPS\", \"30\"))\\n_MOE_DUMP_STEP = {\"n\": 0}\\n_MOE_DUMP_CUR = {\"v\": -1}'\nassert s.count(old_dir) == 1, f\"dir anchor={s.count(old_dir)}\"\ns = s.replace(old_dir, new_dir)\n\nold_router = '''def _moe_dump_router(moe_input: torch.Tensor, router_logits: torch.Tensor) -> None:\n    if _MOE_DUMP_DIR is None:\n        return\n    rank = _moe_dump_rank()\n    marker = os.path.join(_MOE_DUMP_DIR, \"step0\", f\"rank{rank}_router_logits.npy\")\n    if os.path.exists(marker):\n        return\n    _moe_dump_tensor(0, \"moe_input\", moe_input)\n    _moe_dump_tensor(0, \"router_logits\", router_logits)'''\nnew_router = '''def _moe_dump_alloc(rank: int) -> int:\n    marker = os.path.join(_MOE_DUMP_DIR, \"step0\", f\"rank{rank}_moe_input.npy\")\n    if not os.path.exists(marker):\n        _MOE_DUMP_STEP[\"n\"] = 0\n    step = _MOE_DUMP_STEP[\"n\"]\n    _MOE_DUMP_STEP[\"n\"] += 1\n    return step\n\n\ndef _moe_dump_router(moe_input: torch.Tensor, router_logits: torch.Tensor) -> None:\n    if _MOE_DUMP_DIR is None:\n        return\n    rank = _moe_dump_rank()\n    step = _moe_dump_alloc(rank)\n    _MOE_DUMP_CUR[\"v\"] = step\n    if step >= _MOE_DUMP_MAX:\n        return\n    _moe_dump_tensor(step, \"moe_input\", moe_input)\n    _moe_dump_tensor(step, \"router_logits\", router_logits)'''\nassert s.count(old_router) == 1, f\"router anchor={s.count(old_router)}\"\ns = s.replace(old_router, new_router)\n\nold_topk = '''def _moe_dump_topk(topk_ids: torch.Tensor, topk_weights: torch.Tensor) -> None:\n    if _MOE_DUMP_DIR is None:\n        return\n    rank = _moe_dump_rank()\n    marker = os.path.join(_MOE_DUMP_DIR, \"step0\", f\"rank{rank}_topk_ids.npy\")\n    if os.path.exists(marker):\n        return\n    _moe_dump_tensor(0, \"topk_ids\", topk_ids)\n    _moe_dump_tensor(0, \"topk_weights\", topk_weights)'''\nnew_topk = '''def _moe_dump_topk(topk_ids: torch.Tensor, topk_weights: torch.Tensor) -> None:\n    if _MOE_DUMP_DIR is None:\n        return\n    step = _MOE_DUMP_CUR[\"v\"]\n    if step < 0 or step >= _MOE_DUMP_MAX:\n        return\n    _moe_dump_tensor(step, \"topk_ids\", topk_ids)\n    _moe_dump_tensor(step, \"topk_weights\", topk_weights)'''\nassert s.count(old_topk) == 1, f\"topk anchor={s.count(old_topk)}\"\ns = s.replace(old_topk, new_topk)\n\nold_out = '''def _moe_dump_output(routed_output: torch.Tensor, output: torch.Tensor) -> None:\n    if _MOE_DUMP_DIR is None:\n        return\n    rank = _moe_dump_rank()\n    marker = os.path.join(_MOE_DUMP_DIR, \"step0\", f\"rank{rank}_moe_output.npy\")\n    if os.path.exists(marker):\n        return\n    _moe_dump_tensor(0, \"routed_output\", routed_output)\n    _moe_dump_tensor(0, \"moe_output\", output)'''\nnew_out = '''def _moe_dump_output(routed_output: torch.Tensor, output: torch.Tensor) -> None:\n    if _MOE_DUMP_DIR is None:\n        return\n    step = _MOE_DUMP_CUR[\"v\"]\n    if step < 0 or step >= _MOE_DUMP_MAX:\n        return\n    _moe_dump_tensor(step, \"routed_output\", routed_output)\n    _moe_dump_tensor(step, \"moe_output\", output)'''\nassert s.count(old_out) == 1, f\"out anchor={s.count(old_out)}\"\ns = s.replace(old_out, new_out)\n\np.write_text(s)\nprint(\"moe_runner.py multi-step patched\")\nPYEOF\nB64=$(base64 -w0 /tmp/patch_vllm_multi_step.py)\necho \"$B64\" | sshpass -p 'USj5Qvl7zb29' ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o PreferredAuthentications=password -o PubkeyAuthentication=no wangxiaohan17@11.87.191.104 \"docker exec -i vllm-k3-wxh bash -c 'base64 -d | python3'\" 2>&1 | tail -3", "Bash=cat > /tmp/wait_xllm_multistep.sh <<'SH'\n#!/bin/bash\nset -u\nfor i in $(seq 1 40); do\n  if curl -s --max-time 5 http://127.0.0.1:13636/v1/models 2>/dev/null | grep -q '\"id\"'; then\n    echo \"就绪 at $((i*15))s\"; break\n  fi\n  sleep 15\ndone\nsleep 8\nrm -rf /export/home/wangxiaohan17/wangxiaohan/kimi-k3/moe_dump_xllm/step*\necho \"已清空 step*\"\npython3 - <<'PYEOF'\nfrom openai import OpenAI\nclient = OpenAI(api_key=\"EMPTY\", base_url=\"http://127.0.0.1:13636/v1/\", t